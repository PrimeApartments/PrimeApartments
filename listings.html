<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PrimeApartments | Listings</title>

  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

  <style>
    .modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.8);
      z-index: 9999;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .modal-box {
      background: white;
      width: 100%;
      max-width: 950px;
      border-radius: 18px;
      overflow: hidden;
      display: flex;
      flex-wrap: wrap;
      position: relative;
    }

    .modal-box img {
      width: 100%;
      max-width: 480px;
      height: 100%;
      object-fit: cover;
    }

    .modal-info {
      flex: 1;
      padding: 20px;
    }

    .modal-info h2 {
      margin-bottom: 10px;
    }

    .modal-info p {
      margin-bottom: 10px;
      color: #444;
    }

    .close {
      position: absolute;
      top: 10px;
      right: 15px;
      font-size: 30px;
      cursor: pointer;
      color: black;
    }

    .gallery-thumbs {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      margin-top: 15px;
    }

    .thumb-box {
      text-align: center;
    }

    .thumb-box img {
      width: 90px;
      height: 70px;
      border-radius: 10px;
      cursor: pointer;
      object-fit: cover;
      border: 2px solid transparent;
    }

    .thumb-box img:hover {
      border: 2px solid #2563eb;
    }

    .thumb-box p {
      font-size: 12px;
      margin-top: 4px;
      color: #222;
      font-weight: 500;
    }

    .save-btn {
      margin-top: 15px;
      background: #2563eb;
      color: white;
      border: none;
      padding: 10px 15px;
      border-radius: 10px;
      cursor: pointer;
      font-weight: 600;
    }
  </style>
</head>

<section class="section">
  <div class="section-title">
    <h2>Property Listings</h2>
    <p>Browse 25 apartments under R15000 with full room photo galleries.</p>
  </div>

  <div class="filters">
    <input type="text" id="searchLocation" placeholder="Search location">

    <select id="bedFilter">
      <option value="all">Bedrooms</option>
      <option value="1">1 Bedroom</option>
      <option value="2">2 Bedrooms</option>
      <option value="3">3+ Bedrooms</option>
    </select>

    <select id="priceFilter">
      <option value="all">Max Price</option>
      <option value="5000">Below R5000</option>
      <option value="7000">Below R7000</option>
      <option value="10000">Below R10000</option>
      <option value="15000">Below R15000</option>
    </select>

    <button onclick="filterProperties()">Search</button>
  </div>

  <div class="grid" id="propertyGrid"></div>
</section>

<!-- MODAL -->
<div class="modal" id="modal">
  <div class="modal-box">
    <span class="close" onclick="closeModal()">&times;</span>

    <img id="mainModalImg" src="" alt="Apartment Image">

    <div class="modal-info">

      <p id="modalLocation"></p>

      <p id="modalBeds"></p>
      <p id="modalDesc"></p>

      <button class="save-btn" onclick="saveFavourite()">❤️ Save to Favourites</button>

      <div class="gallery-thumbs" id="thumbGallery"></div>
    </div>
  </div>
</div>

  const propertyGrid = document.getElementById("propertyGrid");
  let selectedProperty = null;

  function displayProperties(list) {
    propertyGrid.innerHTML = "";

    if (list.length === 0) {
      propertyGrid.innerHTML = `<p style="text-align:center;color:#444;">No properties found.</p>`;
      return;
    }

    list.forEach(p => {
      propertyGrid.innerHTML += `
        <div class="card" onclick="openModal(${p.id})">
          <img src="${p.images.main}" alt="${p.title}">
          <div class="info">
            <h3>${p.title}</h3>
            <p><i class="fa-solid fa-location-dot"></i> ${p.location}</p>
            <p class="price">R${p.price.toLocaleString()}</p>
            <p>${p.bedrooms} Bedroom(s)</p>
          </div>
        </div>
      `;
    });
  }

  function filterProperties() {
    const location = document.getElementById("searchLocation").value.toLowerCase();
    const beds = document.getElementById("bedFilter").value;
    const price = document.getElementById("priceFilter").value;

    let filtered = properties.filter(p => {
      const matchLocation = p.location.toLowerCase().includes(location);
      const matchBeds = beds === "all" || (beds === "3" ? p.bedrooms >= 3 : p.bedrooms == beds);
      const matchPrice = price === "all" || p.price <= price;

      return matchLocation && matchBeds && matchPrice;
    });

    displayProperties(filtered);
  }

  function openModal(id) {
    selectedProperty = properties.find(p => p.id === id);

    document.getElementById("modal").style.display = "flex";
    document.getElementById("mainModalImg").src = selectedProperty.images.main;

    document.getElementById("modalTitle").innerText = selectedProperty.title;
    document.getElementById("modalLocation").innerText = "📍 " + selectedProperty.location;
    document.getElementById("modalPrice").innerText = "💰 Price: R" + selectedProperty.price.toLocaleString();
    document.getElementById("modalBeds").innerText = "🛏 Bedrooms: " + selectedProperty.bedrooms;
    document.getElementById("modalDesc").innerText = selectedProperty.desc;

    const thumbGallery = document.getElementById("thumbGallery");
    thumbGallery.innerHTML = "";

    const rooms = [
      { label: "🏠 Main", img: selectedProperty.images.main },
      { label: "🛏 Bedroom", img: selectedProperty.images.bedroom },
      { label: "🍽 Kitchen", img: selectedProperty.images.kitchen },
      { label: "🛁 Bathroom", img: selectedProperty.images.bathroom },
      { label: "📺 TV Room", img: selectedProperty.images.lounge }
    ];

    rooms.forEach(room => {
      thumbGallery.innerHTML += `
        <div class="thumb-box">
          <img src="${room.img}" onclick="changeMainImage('${room.img}')">
          <p>${room.label}</p>
        </div>
      `;
    });
  }

  function changeMainImage(img) {
    document.getElementById("mainModalImg").src = img;
  }

  function closeModal() {
    document.getElementById("modal").style.display = "none";
  }

  function saveFavourite() {
    if (!selectedProperty) return;

    let favs = JSON.parse(localStorage.getItem("favourites")) || [];

    if (!favs.includes(selectedProperty.id)) {
      favs.push(selectedProperty.id);
      localStorage.setItem("favourites", JSON.stringify(favs));
      alert("✅ Saved to favourites!");
    } else {
      alert("⚠ Already saved!");
    }
  }

  window.onclick = function(event) {
    const modal = document.getElementById("modal");
    if (event.target === modal) closeModal();
  };

  displayProperties(properties);
</script>
